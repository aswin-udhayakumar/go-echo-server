name: Build and Push Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build and push"
        required: true
        default: "development"

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    with:
      branch: ${{ github.event.inputs.branch }}
  docker-build:
    runs-on: ["self-hosted", "docker-access"]
    needs: ci
    if: needs.ci.result == 'success'
    env:
      AWS_REGION: us-east-1
      ECR_DEV_REGISTRY: 684154893900.dkr.ecr.us-east-1.amazonaws.com
      REPO_NAME: 1v-apigw-go-echo-server
      GIT_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
      - name: Push Docker image to ECR
        run: |
          echo "Pushing Docker image to ECR..."
          aws sts assume-role --role-arn arn:aws:iam::684154893900:role/1v-apigw-atlantis-assume-role --role-session-name BuildPushDockerImageGoEchoServer > assumed-role.json
          export AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' assumed-role.json)
          export AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' assumed-role.json)
          export AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' assumed-role.json)
          echo "Verifying using correct account..."
          aws sts get-caller-identity
          make push-docker-img
